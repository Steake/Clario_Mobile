<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://ga.jspm.io https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.tailwindcss.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://generativelanguage.googleapis.com; img-src 'self' data: https:;">
  <title>Clario - AI Mental Health Companion</title>
  
  <!-- Tailwind CSS with plugins -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio"></script>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  
  <!-- Tailwind Configuration -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#7C3AED',
            'primary-light': '#A78BFA',
            'primary-dark': '#5B21B6',
            'background-light': '#F9FAFB',
            'background-dark': '#0F172A',
            'surface-light': '#FFFFFF',
            'surface-dark': '#1E293B',
            'trust-belief': '#9333EA',
            'trust-anxiety': '#F59E0B',
            'trust-depression': '#3B82F6',
            'trust-stress': '#EF4444',
            'trust-emotional': '#EC4899',
            'trust-neutral': '#6B7280',
            'accent-purple': '#7C3AED',
            'accent-blue': '#3B82F6',
            'accent-pink': '#EC4899',
            'glass-bg': 'rgba(255, 255, 255, 0.1)',
            'glass-border': 'rgba(255, 255, 255, 0.2)',
          },
          fontFamily: {
            sans: ['Lexend', 'system-ui', '-apple-system', 'sans-serif'],
          },
          animation: {
            'gradient': 'gradient 8s ease infinite',
            'float': 'float 6s ease-in-out infinite',
            'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          },
          keyframes: {
            gradient: {
              '0%, 100%': {
                'background-size': '200% 200%',
                'background-position': 'left center'
              },
              '50%': {
                'background-size': '200% 200%',
                'background-position': 'right center'
              },
            },
            float: {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-20px)' },
            },
          },
          backdropBlur: {
            xs: '2px',
          },
        },
      },
    }
  </script>
  
  <!-- Custom Styles -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Lexend', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined';
      font-weight: normal;
      font-style: normal;
      font-size: 24px;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-block;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      -webkit-font-feature-settings: 'liga';
      -webkit-font-smoothing: antialiased;
    }

    /* Hide scrollbar but keep functionality */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Glass effect */
    .glass-effect {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    /* Trust gradient backgrounds */
    .trust-gradient {
      background: linear-gradient(135deg, #7C3AED 0%, #EC4899 100%);
    }

    .hero-gradient {
      background: linear-gradient(180deg, rgba(124, 58, 237, 0.1) 0%, rgba(236, 72, 153, 0.05) 100%);
    }

    /* Dark mode glass effect */
    .dark .glass-effect {
      background: rgba(30, 41, 59, 0.4);
      border: 1px solid rgba(148, 163, 184, 0.1);
    }

    /* Smooth transitions */
    * {
      transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }
  </style>
  
  <!-- Import Map for ES Modules -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://ga.jspm.io/npm:react@19.0.0/index.js",
        "react/": "https://ga.jspm.io/npm:react@19.0.0/",
        "react-dom/client": "https://ga.jspm.io/npm:react-dom@19.0.0/client.js",
        "react-router-dom": "https://cdn.jsdelivr.net/npm/react-router-dom@7.1.1/dist/index.js",
        "@google/generative-ai": "https://cdn.jsdelivr.net/npm/@google/generative-ai@0.21.0/+esm"
      }
    }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
